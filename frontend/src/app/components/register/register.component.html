<div class="auth-shell">
  <div class="auth-panel auth-panel-large">
    <div class="auth-header">
      <div class="brand-mark">
        <i class="bi bi-shield-check"></i>
        <span>GRC</span>
      </div>
      <p class="eyebrow">Création de compte</p>
      <h1>Demande d’accès</h1>
      <p class="subtitle">Remplissez les informations ci-dessous pour demander l’ouverture d’un compte.</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="row-fields">
        <div class="field-group">
          <label for="first-name">Prénom</label>
          <div class="input-wrap">
            <i class="bi bi-person"></i>
            <input id="first-name" type="text" placeholder="Votre prénom" required />
          </div>
        </div>

        <div class="field-group">
          <label for="last-name">Nom</label>
          <div class="input-wrap">
            <i class="bi bi-person-badge"></i>
            <input id="last-name" type="text" placeholder="Votre nom" required />
          </div>
        </div>
      </div>

      <div class="field-group">
        <label for="company">Entreprise</label>
        <div class="input-wrap">
          <i class="bi bi-building"></i>
          <input id="company" type="text" placeholder="Nom de l’entreprise" required />
        </div>
      </div>

      <div class="field-group">
        <label for="register-email">Email professionnel</label>
        <div class="input-wrap">
          <i class="bi bi-envelope"></i>
          <input id="register-email" type="email" placeholder="vous@entreprise.com" required />
        </div>
      </div>

      <div class="field-group">
        <label for="role">Rôle</label>
        <div class="input-wrap">
          <i class="bi bi-briefcase"></i>
          <input id="role" type="text" placeholder="Consultant, responsable, ..." required />
        </div>
      </div>

      <button type="submit" class="primary-btn">
        Envoyer la demande
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login">Déjà inscrit ? Connectez-vous</a>
    </div>
  </div>
</div>
