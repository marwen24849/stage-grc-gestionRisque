<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-header">
      <div class="brand-mark">
        <i class="bi bi-shield-check"></i>
        <span>GRC</span>
      </div>
      <p class="eyebrow">Sécurité</p>
      <h1>Mot de passe oublié</h1>
      <p class="subtitle">Saisissez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field-group">
        <label for="email-reset">Email professionnel</label>
        <div class="input-wrap">
          <i class="bi bi-envelope"></i>
          <input id="email-reset" type="email" placeholder="vous@entreprise.com" required />
        </div>
      </div>

      <button type="submit" class="primary-btn">
        Envoyer le lien
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </div>
</div>
