server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/risque2?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY: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}
      base-url: https://openrouter.ai/api/v1
      chat:
        model: nvidia/nemotron-3.5-lightning:free

jwt:
  secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    tn.esprit.backend: DEBUG
    org.springframework.security: INFO


