server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3377/risque2?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY: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}
      base-url: https://openrouter.ai/api/v1
      chat:
        model: nvidia/nemotron-3.5-lightning:free

jwt:
  secret: ${KEY_SECRET:28e65c6afd4f3e61b9689a52ba0d8eb2528a0121686378028494a76f90900687}
  expiration-ms: ${JWT_EXPIRATION:86400000}

app:
  cors:
    origin: ${APP_CORS_ORIGIN:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD:A8jlqb6qm0m;}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    tn.esprit.backend: DEBUG
    org.springframework.security: INFO


